# Publishes the site to GitHub Pages on every push to main, whoever pushes
# (branch deploys skip pushes made by apps). Run it by hand from the Actions
# tab with "Run workflow". Needs Settings ▸ Pages ▸ Source: GitHub Actions.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Leave out repository files
        run: rm -rf .git .github README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
